name: Build 3DS .3dsx

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          which arm-none-eabi-g++
          ls /opt/devkitpro/devkitARM/bin
          make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cartchaos-3dsx
          path: |
            build/cartchaos.3dsx
            build/cartchaos.smdh
